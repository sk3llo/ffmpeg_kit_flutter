name: ffmpeg_kit_flutter_new_converter_gpl
description: FFmpeg Kit Converter-GPL for Flutter. FFmpeg with x264, x265, LAME, Opus, Vorbis, VP8/VP9, WebP and dav1d. Supports Android, iOS, macOS, Windows and Linux.
repository: https://github.com/sk3llo/ffmpeg_kit_flutter
homepage: https://github.com/sk3llo/ffmpeg_kit_flutter
version: 1.0.0
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.antonkarpenko.ffmpegkit
        pluginClass: FFmpegKitFlutterPlugin
      ios:
        pluginClass: FFmpegKitFlutterPlugin
      macos:
        pluginClass: FFmpegKitFlutterPlugin
      windows:
        pluginClass: FFmpegKitFlutterPlugin
      linux:
        pluginClass: FFmpegKitFlutterPlugin

dependencies:
  ffmpeg_kit_flutter_platform_interface: ^0.2.1

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
